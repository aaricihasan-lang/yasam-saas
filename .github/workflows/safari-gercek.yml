# #804 GEÇİCİ — GERÇEK APPLE SAFARI testleri (GitHub standart macOS runner; repo public → ek ücret yok). MERGE EDİLMEZ.
# Playwright WebKit DEĞİL: /Applications/Safari.app, Apple'ın safaridriver'ı (W3C WebDriver) ile sürülür.
# Uzak otomasyon `sudo safaridriver --enable` ile açılır (Apple'ın belgelenmiş yöntemi; güvenlik kısıtı aşılmaz).
# Sır KULLANMAZ; yalnız 127.0.0.1'de sentetik sayfalar/veriler. Kanıtlar kısa süreli artifact.
name: Gerçek Safari

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/safari-gercek.yml"
      - ".github/safari/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-gercek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prob:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ortam (macOS / Safari / SafariDriver / donanım)
        run: |
          {
            echo "### Ortam"
            sw_vers
            echo "Safari: $(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString) ($(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleVersion))"
            echo "safaridriver: $(safaridriver --version 2>&1)"
            echo "mimari: $(uname -m) · çekirdek: $(sysctl -n hw.ncpu) · bellek: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Uzak otomasyonu etkinleştir (Apple belgelenmiş yöntemi)
        run: sudo safaridriver --enable

      - name: safaridriver başlat
        run: |
          nohup safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for i in $(seq 30); do curl -s http://127.0.0.1:4444/status | grep -q ready && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/safaridriver.log"; exit 1

      - name: Gerçek Safari ön probu
        run: |
          OUT="$RUNNER_TEMP/safari/prob" node .github/safari/safari-probu.mjs 2>&1 | tee "$RUNNER_TEMP/safari-prob.log"
          grep "SAFARI-PROBU" "$RUNNER_TEMP/safari-prob.log" | cut -c1-400 >> "$GITHUB_STEP_SUMMARY"

      - name: Kanıtlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-prob-kanit
          path: |
            ${{ runner.temp }}/safari
            ${{ runner.temp }}/safari-prob.log
            ${{ runner.temp }}/safaridriver.log
          if-no-files-found: warn
          retention-days: 7

  # Uygulama kabulü: A = güncel main (F2 YOK), B = main + F2 — AYNI sentetik arka uç / görseller / sürücü, ayrı makineler.
  uygulama:
    needs: prob
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: main
            ref: c9087c39cd6c4afe1aca15ae66978fc92523d234
          - mod: f2
            ref: a128308c1cbbc3b20891d8bd5ef2c9959bb9ff62
    name: uygulama (${{ matrix.mod }})
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fake_local
      SUPABASE_SERVICE_ROLE_KEY: fake-local-service-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Test araçları (#804'ten; yalnız runner'a kopyalanır)
        uses: actions/checkout@v4
        with:
          path: arac
          sparse-checkout: .github/safari
      - run: |
          mkdir -p "$RUNNER_TEMP/arac" && cp arac/.github/safari/* "$RUNNER_TEMP/arac/" && rm -rf arac
          git status --porcelain
          echo "Test edilen: ${{ matrix.mod }} $(git log --oneline -1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund || (echo "::warning::npm ci ilk deneme başarısız; bir kez yeniden" && npm ci --no-audit --no-fund)
      # Tip denetimi zorunlu CI'da (ci.yml TypeScript) yapılır; bu test build'inde runner belleği için atlanır (yalnız runner kopyası).
      - name: Test build'i için tip denetimini atla (yalnız bu runner)
        run: node scripts/campaign/ci-e2e-build-config.cjs
      - name: Next.js production build
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: next start + sentetik arka uç
        run: |
          nohup node node_modules/next/dist/bin/next start -p 3984 -H 127.0.0.1 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          cp "$RUNNER_TEMP/arac/sentetik-sunucu.ts" scripts/workspace/.safari-sunucu.ts
          MOD=${{ matrix.mod }} nohup npx tsx scripts/workspace/.safari-sunucu.ts > "$RUNNER_TEMP/sunucu.log" 2>&1 &
          for i in $(seq 120); do [ "$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:8080/settings)" = 200 ] && exit 0; sleep 2; done
          tail -30 "$RUNNER_TEMP/next-start.log"; tail -30 "$RUNNER_TEMP/sunucu.log"; exit 1
      - name: safaridriver
        run: |
          sudo safaridriver --enable
          nohup safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for i in $(seq 30); do curl -s http://127.0.0.1:4444/status | grep -q ready && exit 0; sleep 1; done; exit 1
      - name: Gerçek Safari uygulama testleri (${{ matrix.mod }})
        run: |
          echo "Safari: $(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString) · macOS $(sw_vers -productVersion)" | tee -a "$GITHUB_STEP_SUMMARY"
          MOD=${{ matrix.mod }} OUT="$RUNNER_TEMP/safari-uygulama" node "$RUNNER_TEMP/arac/safari-uygulama.mjs" 2>&1 | tee "$RUNNER_TEMP/safari-uygulama.log"
          rc=${PIPESTATUS[0]}
          grep -E "^(PASS|FAIL|NOT TESTED) |SAFARI-" "$RUNNER_TEMP/safari-uygulama.log" | cut -c1-300 >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Kanıtlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-uygulama-${{ matrix.mod }}
          path: |
            ${{ runner.temp }}/safari-uygulama/*.png
            ${{ runner.temp }}/safari-uygulama/*.txt
            ${{ runner.temp }}/safari-uygulama.log
            ${{ runner.temp }}/sunucu.log
            ${{ runner.temp }}/next-start.log
          if-no-files-found: warn
          retention-days: 7
