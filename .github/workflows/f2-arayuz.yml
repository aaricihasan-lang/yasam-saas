# UZMAN PROFİLİ F2 (#774) — rapor logosu ARAYÜZ KABULÜ (Playwright: Chromium + Firefox + WebKit). YALNIZ bu kabul için ayrı,
# yol filtreli iş akışı; ana CI'ı (ci.yml) değiştirmez. Taban dalı work/rapor-logo-f2 olan ayrı Draft PR'da koşar; MERGE EDİLMEZ.
# Sır KULLANMAZ. Production'a / Supabase'e / Vercel'e istek ATMAZ: harness'lar API'yi bellekte sahte arka uçla karşılar,
# 127.0.0.1 dışı istekleri abort eder; build yalnız yerel sahte değerlerle. Kanıt: ekran görüntüleri + günlükler (artifact).
name: F2 arayüz kabulü

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/f2-arayuz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f2-arayuz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arayuz:
    # Playwright'ın resmî desteklediği imaj (WebKit/Firefox sistem bağımlılıkları).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fake_local
      SUPABASE_SERVICE_ROLE_KEY: fake-local-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kurulum

      - name: Playwright tarayıcıları (Chromium + Firefox + WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Next.js production build
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Tek sunucu (next start, 127.0.0.1:3984)
        run: |
          nohup node node_modules/next/dist/bin/next start -p 3984 -H 127.0.0.1 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for i in $(seq 90); do [ "$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:3984/settings)" = 200 ] && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/next-start.log"; exit 1

      # Harness'lar sırayla (tek tarayıcı süreci); biri düşse de diğerleri koşar, iş sonunda toplu karar.
      - name: Arayüz harness'ları
        env:
          UI_BASE: http://127.0.0.1:3984
        run: |
          K="$RUNNER_TEMP/f2-arayuz"; mkdir -p "$K"; rc=0
          for t in "ui-logo:scripts/profile/ui-logo.harness.ts" "ui-delete-message:scripts/profile/ui-delete-message.harness.ts" \
                   "ui-profile:scripts/profile/ui-profile.harness.ts" "ui-membership:scripts/settings-membership/ui-membership.harness.ts"; do
            n="${t%%:*}"; f="${t#*:}"
            echo "::group::$n"
            UI_OUT="$K/$n" npx tsx "$f" 2>&1 | tee "$K/$n.log"; r=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "$n RC=$r · $(grep -aE 'PASS / [0-9]+ FAIL|geçti, [0-9]+ kaldı' "$K/$n.log" | tail -1)" | tee -a "$K/ozet.txt"
            [ "$r" = 0 ] || rc=1
          done
          cat "$K/ozet.txt" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # TANILAMA (yalnız runner'daki geçici kopya; repodaki harness DEĞİŞMEZ): ui-profile [E] "ilk hatalı alana odak" kontrolü
      # odak requestAnimationFrame içinde taşındığı hâlde tıklamadan hemen sonra okunuyor. Kopyada aynı kontrol önce anlık değeri
      # kaydeder, sonra odağı en çok 2 sn bekler → odağın geç mi geldiği, hiç mi gelmediği ayrılır. Karar bu adıma bağlı DEĞİL.
      - name: Tanılama — ui-profile odak zamanlaması (geçici kopya)
        if: always()
        env:
          UI_BASE: http://127.0.0.1:3984
        run: |
          K="$RUNNER_TEMP/f2-arayuz"; mkdir -p "$K"
          node -e '
            const fs = require("fs");
            const src = "scripts/profile/ui-profile.harness.ts", dst = "scripts/profile/.odak-tani.harness.ts";
            const eski = "(await c.page.evaluate(\"document.activeElement && document.activeElement.getAttribute(\x27name\x27)\")) === \"title\"";
            const s = fs.readFileSync(src, "utf8");
            if (s.split(eski).length !== 2) { console.error("kontrol satırı tek değil"); process.exit(2); }
            const yeni = "(await (async () => { const t0 = Date.now(); const ilk = await c.page.evaluate(\"document.activeElement && document.activeElement.getAttribute(\x27name\x27)\"); const r = await c.page.waitForFunction(\"document.activeElement && document.activeElement.getAttribute(\x27name\x27) === \x27title\x27\", null, { timeout: 2000 }).then(() => true, () => false); const son = await c.page.evaluate(\"document.activeElement && document.activeElement.getAttribute(\x27name\x27)\"); console.log(\"ODAK-TANI ilk=\" + ilk + \" son=\" + son + \" bekleme_sonucu=\" + r + \" ms=\" + (Date.now() - t0)); return son; })()) === \"title\"";
            fs.writeFileSync(dst, s.replace(eski, yeni));
          '
          UI_OUT="$K/odak-tani" npx tsx scripts/profile/.odak-tani.harness.ts > "$K/odak-tani.log" 2>&1; echo "odak-tani RC=$?"
          grep -a "ODAK-TANI\|\[E\] ilk hatalı\|PASS / " "$K/odak-tani.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kanıtlar (ekran görüntüleri + günlükler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-arayuz-kanit
          path: ${{ runner.temp }}/f2-arayuz
          if-no-files-found: warn
          retention-days: 30
