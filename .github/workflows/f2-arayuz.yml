# UZMAN PROFİLİ F2 (#774) — rapor logosu ARAYÜZ KABULÜ (Playwright: Chromium + Firefox + WebKit). YALNIZ bu kabul için ayrı,
# yol filtreli iş akışı; ana CI'ı (ci.yml) değiştirmez. Taban dalı work/rapor-logo-f2 olan ayrı Draft PR'da koşar; MERGE EDİLMEZ.
# Sır KULLANMAZ. Production'a / Supabase'e / Vercel'e istek ATMAZ: harness'lar API'yi bellekte sahte arka uçla karşılar,
# 127.0.0.1 dışı istekleri abort eder; build yalnız yerel sahte değerlerle. Kanıt: ekran görüntüleri + günlükler (artifact).
name: F2 arayüz kabulü

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/f2-arayuz.yml"
      - ".github/f2-arayuz/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f2-arayuz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arayuz:
    # Playwright'ın resmî desteklediği imaj (WebKit/Firefox sistem bağımlılıkları).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fake_local
      SUPABASE_SERVICE_ROLE_KEY: fake-local-service-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ÖN İZLEME: Owner onaylı Profilim odak testi düzeltmesi (ayrı Draft PR, main tabanlı) runner checkout'una normal merge
      # edilir → test edilen kod = #774 + güncel main + düzeltme (main'e girdiğinde bu adım değişiklik getirmez). Repoya yazılmaz.
      - name: Onaylı test düzeltmesini ön birleştir (yalnız runner)
        run: |
          git -c user.name=ci -c user.email=ci@localhost fetch -q origin fix/profil-odak-testi
          git -c user.name=ci -c user.email=ci@localhost merge --no-ff --no-edit FETCH_HEAD
          git log --oneline -3 | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD^1 HEAD | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/kurulum

      - name: Playwright tarayıcıları (Chromium + Firefox + WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Next.js production build
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Tek sunucu (next start, 127.0.0.1:3984)
        run: |
          nohup node node_modules/next/dist/bin/next start -p 3984 -H 127.0.0.1 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for i in $(seq 90); do [ "$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:3984/settings)" = 200 ] && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/next-start.log"; exit 1

      # Harness'lar sırayla (tek tarayıcı süreci); biri düşse de diğerleri koşar, iş sonunda toplu karar.
      # Tam takımlar 3 tarayıcıda: Chromium = repodaki dosyalar AYNEN; Firefox / WebKit = runner'da geçici kopya, YALNIZ ana
      # tarayıcıyı başlatan `chromium.launch()` ifadesi UI_TARAYICI'ya göre seçilir (kontroller/beklentiler değişmez).
      # Ek: geçici silme onayı testi (.github/f2-arayuz/silme-onay.harness.ts) — iptal / Escape / onay (409) / onay (200).
      - name: Arayüz harness'ları (Chromium + Firefox + WebKit)
        env:
          UI_BASE: http://127.0.0.1:3984
        run: |
          K="$RUNNER_TEMP/f2-arayuz"; mkdir -p "$K"; rc=0
          T="ui-logo:scripts/profile/ui-logo.harness.ts ui-delete-message:scripts/profile/ui-delete-message.harness.ts ui-profile:scripts/profile/ui-profile.harness.ts ui-membership:scripts/settings-membership/ui-membership.harness.ts"
          for t in $T; do
            f="${t#*:}"; d="$(dirname "$f")/.tarayici-$(basename "$f")"
            node -e '
              const fs = require("fs"); const [src, dst] = process.argv.slice(1);
              const s = fs.readFileSync(src, "utf8"); const n = s.split("chromium.launch()").length - 1;
              if (n !== 1) { console.error(src + ": chromium.launch() sayısı " + n); process.exit(2); }
              fs.writeFileSync(dst, s.replace("chromium.launch()", `(await import("playwright"))[process.env.UI_TARAYICI || "chromium"].launch()`));
            ' "$f" "$d"
          done
          cp .github/f2-arayuz/silme-onay.harness.ts scripts/profile/.silme-onay.harness.ts
          kos() { # ad dosya tarayici
            echo "::group::$1 ($3)"
            UI_TARAYICI="$3" UI_OUT="$K/$3/$1" npx tsx "$2" > "$K/$3-$1.log" 2>&1; r=$?
            tail -5 "$K/$3-$1.log"; echo "::endgroup::"
            echo "$3 $1 RC=$r · $(grep -aE 'PASS / [0-9]+ FAIL|geçti, [0-9]+ kaldı' "$K/$3-$1.log" | tail -1)" | tee -a "$K/ozet.txt"
            [ "$r" = 0 ] || rc=1
          }
          for t in $T; do n="${t%%:*}"; f="${t#*:}"; kos "$n" "$f" chromium; done
          for b in firefox webkit; do for t in $T; do n="${t%%:*}"; f="${t#*:}"; kos "$n" "$(dirname "$f")/.tarayici-$(basename "$f")" "$b"; done; done
          kos silme-onay scripts/profile/.silme-onay.harness.ts uc-tarayici
          cat "$K/ozet.txt" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Kanıtlar (ekran görüntüleri + günlükler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-arayuz-kanit
          path: ${{ runner.temp }}/f2-arayuz
          if-no-files-found: warn
          retention-days: 30
