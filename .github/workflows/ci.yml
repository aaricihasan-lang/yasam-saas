# X-02 (satış öncesi AŞAMA 1): otomatik kontrol kapısı.
# Sır KULLANMAZ, production'a/Supabase'e/ücretli API'ye istek ATMAZ. Yalnız:
#   - TypeScript tip kontrolü
#   - Migration adlandırma/sıra koruması (DB-02)
#   - Güvenlik çekirdeği harness'ları (sahte PostgREST; ağ yok)
#   - Yeni AŞAMA 1 migration'larının geçici embedded-postgres üzerinde doğrulanması
#   - RKS-2: satış/stok regresyon testleri (yerel embedded-postgres + sabit sürümlü PostgREST)
#     ve test sayısı kapısı (yanlış PASS koruması)
#   - RKS-2: Next.js production build
#   - RKS-3: merkezî regresyon kapısı (scripts/rks/): değişen dosya → modül/import grafiği → doğrulanmış
#     güvenli testlerin seçimi; kapsam kilidi, assertion/envanter zayıflatma ve kritik-korumasız denetimi
# Deploy, merge veya Vercel ile ilişkisi yoktur (deploy Vercel Git entegrasyonundadır).
name: CI

on:
  pull_request:
    # RKS-3: PR gövdesindeki ```rks-kapsam bildirimi ve Owner etiketleri değişince kapı yeniden değerlendirilir.
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Migration adlandırma (DB-02)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/migration-naming-check.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/ci/migration-naming-check.mjs
          fi

      - name: Güvenlik çekirdeği harness'ları
        run: npm run test:asama1

      - name: AŞAMA 1 migration doğrulaması (geçici embedded-postgres)
        run: npm run test:asama1:pg

      # RKS-2: satış/stok regresyon testleri. Yalnız yerel geçici embedded-postgres + PostgREST
      # (127.0.0.1); production'a / Supabase'e / ücretli API'ye istek YOK. PostgREST sürümü ve
      # SHA-256'sı sabit (upstream checksum yayınlamıyor; değer resmi v12.2.3 sürüm dosyasından).
      - name: PostgREST 12.2.3 (sabit sürüm + SHA-256 doğrulaması)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgrest"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/postgrest"
          "$RUNNER_TEMP/postgrest/postgrest" --version

      - name: Satış/stok regresyon testleri (RKS-2)
        env:
          POSTGREST_BIN: ${{ runner.temp }}/postgrest/postgrest
        run: |
          set -euo pipefail
          npm run test:urun-stok:regression 2>&1 | tee "$RUNNER_TEMP/rks2-urun-stok.log"

      # Yanlış PASS koruması: her test bölümü çalışmış, FAIL=0 ve PASS ≥ bilinen alt sınır olmalı;
      # atlanan bölüm (ATLANDI) veya eksik özet satırı başarısızlıktır.
      - name: Satış/stok regresyon — test sayısı kapısı (RKS-2)
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/rks2-urun-stok.log"
          grep -qE '^RKS:END[[:space:]]*$' "$LOG" || { echo "::error::regresyon zinciri sonuna ulaşmadı"; exit 1; }
          if grep -q 'ATLANDI' "$LOG"; then echo "::error::atlanan test bölümü var (PASS sayılmaz)"; exit 1; fi
          counts() {
            local l p q
            l=$(grep -oE '[0-9]+ PASS / [0-9]+ FAIL' <<<"$1" | tail -1 || true)
            if [ -n "$l" ]; then sed -E 's#([0-9]+) PASS / ([0-9]+) FAIL#\1 \2#' <<<"$l"; return; fi
            l=$(grep -oE 'PASS [0-9]+ +FAIL [0-9]+' <<<"$1" | tail -1 || true)
            if [ -n "$l" ]; then sed -E 's#PASS ([0-9]+) +FAIL ([0-9]+)#\1 \2#' <<<"$l"; return; fi
            p=$(grep -oE '"pass": [0-9]+' <<<"$1" | tail -1 | grep -oE '[0-9]+' || true)
            q=$(grep -oE '"fail": [0-9]+' <<<"$1" | tail -1 | grep -oE '[0-9]+' || true)
            if [ -n "$p" ] && [ -n "$q" ]; then echo "$p $q"; return; fi
            echo "-1 -1"
          }
          bad=0; total=0
          while read -r name min; do
            seg=$(awk -v n="$name" '{sub(/[[:space:]]+$/, "")} $0 == "RKS:BEGIN " n {f=1; next} /^RKS:(BEGIN|END)/ {f=0} f' "$LOG")
            read -r pass fail <<<"$(counts "$seg")"
            if [ -z "$seg" ] || [ "$pass" -lt 0 ]; then echo "::error::$name: test çalışmadı / özet satırı yok"; bad=1; continue; fi
            if [ "$fail" -ne 0 ] || [ "$pass" -lt "$min" ]; then echo "::error::$name: $pass PASS / $fail FAIL (beklenen ≥ $min PASS, 0 FAIL)"; bad=1; continue; fi
            echo "OK  $name: $pass PASS / 0 FAIL (alt sınır $min)"; total=$((total + pass))
          done <<'EOF'
          s1-istemci 45
          s2-istemci 49
          satis-gorunurluk 25
          diger-secim 74
          dogaltas-satis-kapisi 130
          dogaltas-cas-route 16
          satis-rpc-pg 55
          s1-pg 22
          s2-pg 21
          satis-gorunurluk-pg 23
          EOF
          [ "$bad" -eq 0 ] || exit 1
          echo "RKS-2 satış/stok regresyon: toplam $total PASS"

      # RKS-3: merkezî regresyon kapısı. Testler sır içermeyen ortamda + net-guard (yalnız 127.0.0.1)
      # altında koşar; production/Supabase/Roxy/ücretli API erişimi engellenir ve FAIL sayılır.
      - name: RKS-3 öz-test (kapı mantığı)
        run: node scripts/rks/selftest.mjs

      - name: RKS-3 değişiklik analizi ve test seçimi
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            BASE="HEAD~1"
          fi
          node scripts/rks/select.mjs --base "$BASE" --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/rks3-plan.json"

      - name: RKS-3 seçili regresyon testleri ve kapı kararı
        env:
          POSTGREST_BIN: ${{ runner.temp }}/postgrest/postgrest
        run: node scripts/rks/run.mjs --plan "$RUNNER_TEMP/rks3-plan.json" --report "$RUNNER_TEMP/rks3-report.json"

      # RKS-2: üretim derlemesi (Turbopack, varsayılan `next build`). Sır/ortam değişkeni gerektirmez.
      - name: Next.js production build
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
