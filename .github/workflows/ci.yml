# X-02 (satış öncesi AŞAMA 1): otomatik kontrol kapısı.
# Sır KULLANMAZ, production'a/Supabase'e/ücretli API'ye istek ATMAZ. Yalnız:
#   - TypeScript tip kontrolü
#   - Migration adlandırma/sıra koruması (DB-02)
#   - Güvenlik çekirdeği harness'ları (sahte PostgREST; ağ yok)
#   - Yeni AŞAMA 1 migration'larının geçici embedded-postgres üzerinde doğrulanması
#   - Regresyon testleri (scripts/ci/regression-tests.json — satış/stok dahil): her çalıştırmada TAMAMI,
#     sır içermeyen ortam + net-guard (yalnız 127.0.0.1) + yerel embedded-postgres / sabit sürümlü PostgREST
#   - Next.js production build
# Akıllı CI F2 (2026-11-10): önceki tek `checks` işi KAPSAM DEĞİŞMEDEN bağımsız işlere bölündü — typescript, build, guvenlik
# (DB-02 + güvenlik çekirdeği + AŞAMA 1 PG + yedek), regresyon (listenin TAMAMI 3 paralel parçada; her test tam bir kez).
# Her iş ayrı makinede koşar (port / geçici dizin / süreç paylaşımı yok). `ci-kapisi` tek karar noktasıdır: zorunlu işlerin
# hepsi "success" değilse veya regresyon parçaları listeyi tam bir kez PASS olarak kapsamıyorsa kapı FAIL verir.
# Deploy, merge veya Vercel ile ilişkisi yoktur (deploy Vercel Git entegrasyonundadır).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kurulum

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Üretim derlemesi (Turbopack, varsayılan `next build`). Sır/ortam değişkeni gerektirmez.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kurulum

      - name: Next.js production build
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Güvenlik ve migration doğrulamaları (önceki `checks` işindeki sıra ve komutlar aynen).
  guvenlik:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/kurulum

      - name: Migration adlandırma (DB-02)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/migration-naming-check.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/ci/migration-naming-check.mjs
          fi

      - name: Güvenlik çekirdeği harness'ları
        run: npm run test:asama1

      - name: AŞAMA 1 migration doğrulaması (geçici embedded-postgres)
        run: npm run test:asama1:pg

      # Ayarlar → Sistem Yedeği / Dışa Aktarım (Owner kararı 2026-11-09): registry kapsamı (migration + kod), şema senkronu,
      # sahte DB roundtrip / saldırgan senaryoları, Word arşivi + PGlite üzerinde gerçek migration'larla Gökyüzü Atlası /
      # HD İlişki yedek-geri yükleme. Ağ / sır yok. Prod tablo listesi CI'da olmadığından o 3 kontrol "ATLANDI" yazılır
      # (PASS sayılmaz); liste dosyası verilen yerel / owner koşusunda zorunlu çalışır.
      - name: Yedek / dışa aktarım harness'ları
        run: npm run test:backup
        env:
          BACKUP_PROD_TABLES_OPTIONAL: "1"

  # Bağımsız regresyon testleri: listenin TAMAMI her çalıştırmada koşar (seçim / kapsam bildirimi / etiket kuralı yok).
  # Liste scripts/ci/regression-shard.mjs ile 3 parçaya bölünür (ölçülmüş sürelerle dengeli, deterministik; her test tam bir
  # parçada). Parça içinde testler önceki gibi SERİ koşar; parçalar ayrı makinelerdedir. Sır içermeyen ortam + net-guard;
  # dış ağ denemesi, atlanan bölüm, FAIL veya okunamayan özet başarısızlıktır. Her parça sonuç dosyasını yükler; ci-kapisi
  # üç dosyanın listeyi tam bir kez ve PASS olarak kapsadığını doğrular.
  regresyon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2, 3]
    name: regresyon (${{ matrix.parca }}/3)
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kurulum

      # Regresyon testleri için yerel PostgREST (yalnız 127.0.0.1; production'a / Supabase'e / ücretli
      # API'ye istek YOK). Sürüm ve SHA-256 sabit (upstream checksum yayınlamıyor; değer resmi v12.2.3
      # sürüm dosyasından).
      - name: PostgREST 12.2.3 (sabit sürüm + SHA-256 doğrulaması)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgrest"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/postgrest.tar.xz"             https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/postgrest"
          "$RUNNER_TEMP/postgrest/postgrest" --version

      - name: Regresyon testleri (parça ${{ matrix.parca }}/3)
        env:
          POSTGREST_BIN: ${{ runner.temp }}/postgrest/postgrest
        run: node scripts/ci/run-regression.mjs --parca "${{ matrix.parca }}/3" --sonuc "$RUNNER_TEMP/regresyon-sonuc/parca-${{ matrix.parca }}.json"

      - name: Regresyon parça sonucu (CI kapısı için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regresyon-sonuc-${{ matrix.parca }}
          path: ${{ runner.temp }}/regresyon-sonuc/parca-${{ matrix.parca }}.json
          if-no-files-found: warn
          retention-days: 14

  # Gökyüzü Atlası — Batı Horary (William Lilly) hesaplama motoru. Bağımsız ve paralel; ağ/sır/PostgreSQL kullanmaz.
  # Herhangi bir FAIL komutu sıfırdan farklı çıkışla bitirir → bu iş ve CI başarısız olur.
  horary-western:
    # Yedek/geri yükleme adımı runner'daki sistem PostgreSQL araçlarını (initdb/pg_ctl/postgres/pg_dump/pg_restore, 15–17) kullanır.
    # ubuntu-latest → ubuntu-26.04 geçişinde bu araçlar imajda yok (2026-11-07, PR #758 koşusu); 24.04 imajı PostgreSQL 16 içerir.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/kurulum

      - name: Horary (Batı / Lilly) harness'ları
        run: npm run test:astrology:horary-western

      # astro_horary_questions migration'ı (20271210000000) GEÇİCİ embedded-postgres üzerinde: RLS / yetki / FK / değişmezlik /
      # eşzamanlı tavan. Yalnız yerel geçici veritabanı; production / staging'e bağlanmaz.
      - name: Horary kayıt tablosu (geçici PostgreSQL)
        run: npm run test:astrology:horary-pg

      # Horary kayıtlarının yedek / geri yükleme doğrulaması: runner'daki PostgreSQL araçlarıyla GEÇİCİ küme (initdb; sentetik veri).
      - name: Horary kayıt yedek / geri yükleme (geçici PostgreSQL kümesi)
        run: npm run test:astrology:horary-backup

  # Gökyüzü Atlası — YENİ PROFESYONEL MOTORLAR (lib/astrology/pro/**: ortak zaman katmanı ve sonraki motorlar). Bağımsız ve paralel;
  # Roxy'ye / ağa / sırlara erişmez (pro-run-all.mjs sırları siler ve net-guard yükler). scripts/astrology/pro-*.harness.ts dosyalarını
  # kendisi keşfeder → yeni motor PR'ları bu dosyayı değiştirmeden kapsama girer. Herhangi bir FAIL bu işi başarısız yapar.
  astro-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/kurulum

      # JPL DE440 (efemeris + derece geçişleri konum motoru): depoda yok; resmî NASA/JPL kaynağından indirilir, SHA-256 doğrulanır.
      - name: JPL DE440 verisi (önbellek)
        uses: actions/cache@v4
        with:
          path: data/ephemeris/de440.bsp
          key: jpl-de440-a4ce9bf9b3282becc9f4b2ac3cebe03a2ae7599981aabd7265fd8482fff7c4b5

      - name: JPL DE440 verisi (resmî kaynak + SHA-256)
        run: node scripts/astrology/de440/fetch-de440.mjs
        env:
          DE440_REQUIRED: "1"

      - name: Profesyonel astroloji motorları (pro-*) harness'ları
        run: npm run test:astrology:pro

  # CI KAPISI — tek karar noktası. Her koşulda çalışır; zorunlu işlerden biri failure / cancelled / skipped ise ya da
  # regresyon parçaları listeyi tam bir kez ve PASS olarak kapsamıyorsa FAIL verir (scripts/ci/ci-gate.mjs).
  ci-kapisi:
    if: always()
    needs: [typescript, build, guvenlik, regresyon, astro-pro, horary-western]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Eksik parça sonucu kapıda FAIL'dir; indirme hatası kararı kapıya bırakır (sessiz geçiş olmaz).
      - name: Regresyon parça sonuçları
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: regresyon-sonuc-*
          merge-multiple: true
          path: ${{ runner.temp }}/regresyon-sonuc

      - name: CI kapısı
        env:
          CI_KAPISI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-gate.mjs --sonuc-dir "$RUNNER_TEMP/regresyon-sonuc" --parca-sayisi 3
