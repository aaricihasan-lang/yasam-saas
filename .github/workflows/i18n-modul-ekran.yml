# I18N-F1-R3 — MODÜL EKRAN KABUL TESTİ (Türkçe / İngilizce × 1280 / 390 / 360 px; tüm kapsam içi uzman modül ekranları).
# Ana CI'ya (ci.yml) yük BİNDİRMEZ: ayrı iş akışı; ürün dosyası (app/components/lib/messages/i18n) değişince ya da elle tetiklenir.
# Sır KULLANMAZ; production'a / Supabase'e / ücretli API'ye istek ATMAZ. Build yerel test önüne (127.0.0.1) işaret eden SAHTE
# değerlerle yapılır; veriler sentetiktir (embedded PostgreSQL + PostgREST şimi, scripts/anamnez/testEnv).
# Dil başına bir iş (matrix) — her iş kendi kapı AÇIK build'ini yapar, 3 genişliği paralel bağlamlarda gezer.
# Sonuç: ekran görüntüleri (PNG) + ozet.json + ozet.md + next-sunucu.log → artefakt (14 gün).
# FAIL: sayfa çökmesi / belge-RSC 5xx / yatay taşma / senaryo hatası. BİLGİ: EN'de TR-aday metin, /api 5xx (eksik modül tabloları).
name: I18N modül ekran kabulü

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "messages/**"
      - "i18n/**"
      - "scripts/i18n/modul-ekran-kabul.e2e.ts"
      - ".github/workflows/i18n-modul-ekran.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-modul-ekran-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54398
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: zz-ds-anon-not-a-secret
  SUPABASE_SERVICE_ROLE_KEY: zz-test-service-role-not-a-secret
  I18N_E2E_SUPA_PORT: "54398"

jobs:
  modul-ekran:
    name: modül ekranları (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        locale: [tr, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
      - name: Playwright chromium
        run: npx playwright install --with-deps chromium
      # Tip denetimi zorunlu ana CI'da (ci.yml "TypeScript"); bu test build'inde tekrarlanmaz. YALNIZ runner'ın geçici checkout'unda.
      - name: Test build'i için tip denetimini atla (yalnız bu runner)
        run: node scripts/campaign/ci-e2e-build-config.cjs
      - name: Build (yayın kapısı AÇIK; webpack; sahte yerel değerler)
        run: npx next build --webpack || (echo "::warning title=modul-ekran build::ilk build başarısız; bir kez yeniden deneniyor" && npx next build --webpack)
        env:
          NEXT_PUBLIC_I18N_LOCALE_SWITCHING: "on"
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Modül ekran kabulü (${{ matrix.locale }} × 1280/390/360)
        run: npx tsx scripts/i18n/modul-ekran-kabul.e2e.ts --locales "${{ matrix.locale }}" --widths 1280,390,360 --budget-min 30 --out "$RUNNER_TEMP/modul-ekran/${{ matrix.locale }}"
        env:
          # Doğaltaş Bilgi Kütüphanesi sunucu kapısı (istek anında okunur); kapalıyken ekran 404 olur.
          STONE_LIBRARY_ENABLED: "true"
      - name: Özet (iş özeti sayfasına)
        if: always()
        run: |
          f="$RUNNER_TEMP/modul-ekran/${{ matrix.locale }}/ozet.md"
          if [ -f "$f" ]; then head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "ozet.md üretilmedi" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Kanıtlar (PNG + ozet.json + ozet.md + sunucu günlüğü; sentetik veri)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-modul-ekran-${{ matrix.locale }}
          path: ${{ runner.temp }}/modul-ekran/${{ matrix.locale }}
          if-no-files-found: warn
          retention-days: 14
