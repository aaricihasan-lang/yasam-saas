# Giriş Güvenliği F2 — GERÇEK TARAYICI uçtan uca testleri (F2-L). Ayrı ve yol filtreli iş akışı: yalnız F2 giriş güvenliği
# dosyaları değişince (ve elle) çalışır; ana CI'ı (ci.yml) yavaşlatmaz.
# Sır KULLANMAZ. Production'a / Supabase'e / Vercel'e / gerçek Gmail'e istek ATMAZ:
#   - geçici embedded-postgres + PostgREST shim (yalnız 127.0.0.1), EN GÜNCEL F2 migration zinciri (F2_TEST_DB_LATEST=1;
#     düzey F2_STAGES'ten; koşucu her testin gerçek DB düzeyini doğrular ve özete yazar — sabit düzey YOK)
#   - "telefon" = Node P-256 anahtarı (Android Keystore DEĞİL); e-posta = sentetik sağlayıcı (yerel dosya)
#   - build yalnız yerel test önüne işaret eden SAHTE değerlerle (zz-…-not-a-secret)
# Tarayıcılar: Google Chrome + Microsoft Edge (GERÇEK markalı ikililer; yoksa kurulur, Chromium "Edge" diye sayılmaz) +
# WebKit (Safari MOTORU emülasyonu — gerçek iPhone Safari DEĞİL). Boş paket / atlanan test PASS VEREMEZ (koşucu asgari PASS ister).
# Negatif kontrol: F2-K kuralları kaldırılmış şemada (düzey 1000) f2k testi FAIL VERMEK ZORUNDADIR (testin gerçekten yakaladığının kanıtı).
name: F2 tarayıcı testleri

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "lib/auth/**"
      - "lib/email/**"
      - "lib/admin/adminGrant.ts"
      - "app/api/auth/**"
      - "app/api/devices/**"
      - "app/api/admin/step-up/**"
      - "app/api/admin/users/**"
      - "app/admin/cihaz-onaylari/**"
      - "app/admin/users/**"
      - "app/m/**"
      - "app/page.tsx"
      - "app/layout.tsx"
      - "components/auth/**"
      - "components/admin/OwnerStepUpDialog.tsx"
      - "supabase/migrations/2028010300*"
      - "supabase/migrations/2028010301*"
      - "scripts/giris-guvenligi/**"
      - ".github/workflows/f2-tarayici.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f2-tarayici-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f2-tarayici:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund

      - name: Playwright WebKit + Chromium bağımlılıkları
        run: npx playwright install --with-deps webkit chromium

      # Runner imajında Chrome / Edge hazır gelir; yoksa Playwright'ın kurucusu GERÇEK markalı ikiliyi kurar.
      - name: Google Chrome + Microsoft Edge (gerçek ikililer)
        run: |
          [ -x /opt/google/chrome/chrome ] || npx playwright install chrome
          [ -x /opt/microsoft/msedge/msedge ] || npx playwright install msedge
          /opt/google/chrome/chrome --version
          /opt/microsoft/msedge/msedge --version

      # Tip denetimi zorunlu ana CI'da (ci.yml "typescript") yapılır; yalnız bu runner'ın geçici checkout'unda atlanır (bellek).
      - name: Test build'i için tip denetimini atla (yalnız bu runner)
        run: |
          node scripts/campaign/ci-e2e-build-config.cjs
          grep -n "ignoreBuildErrors" next.config.ts

      - name: Yerel test önüne işaret eden build (webpack; sahte değerler)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54398
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: zz-ds-anon-not-a-secret
          SUPABASE_SERVICE_ROLE_KEY: zz-test-service-role-not-a-secret
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx next build --webpack || (echo "::warning title=f2 build::ilk build başarısız; bir kez yeniden deneniyor" && npx next build --webpack)

      - name: F2 tarayıcı kabulü (Chrome, Edge, WebKit; sırayla)
        run: node scripts/giris-guvenligi/ci-f2-tarayici.mjs --out "$RUNNER_TEMP/f2-tarayici/kabul"

      - name: Negatif kontrol (F2-K kuralları kaldırılınca test FAIL vermeli)
        if: always()
        run: node scripts/giris-guvenligi/ci-f2-tarayici.mjs --out "$RUNNER_TEMP/f2-tarayici/negatif" --negatif

      - name: Bellek / disk
        if: always()
        run: free -m && df -h . | tail -1

      # Yerel hata ayıklama için derleme çıktısı (sahte değerlerle; gizli değer YOK), 2 gün.
      - name: Test build'i (yerel hata ayıklama)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-tarayici-build
          path: |
            .next
            !.next/cache
          retention-days: 2
          if-no-files-found: warn
          include-hidden-files: true

      - name: Kanıtlar (ekran görüntüleri + günlükler + özet; sentetik veri)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-tarayici-kanit
          path: |
            ${{ runner.temp }}/f2-tarayici/**/*.png
            ${{ runner.temp }}/f2-tarayici/**/gunluk.txt
            ${{ runner.temp }}/f2-tarayici/**/ozet.*
          retention-days: 14
          if-no-files-found: error
