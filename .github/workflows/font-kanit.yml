# GEÇİCİ KANIT İŞ AKIŞI — Google Fonts yerelleştirmesi (fix/google-fonts-yerel). Final commit'te KALDIRILIR.
# CI kapısına bağlı değildir; ci.yml'ye dokunmaz. Sır / production / veritabanı yok.
#   once           : main (PR tabanı) next/font/google ile, normal ağ → build + ekran görüntüsü
#   once-agsiz     : main, Google Fonts AĞI ENGELLİ (/etc/hosts) → build'in DÜŞMESİ beklenir (engelin etkili olduğunun kanıtı)
#   sonra-agsiz    : PR, Google Fonts AĞI ENGELLİ → build GEÇMELİ + ekran görüntüsü + çıktıda Google izi yok
#   kiyas          : önce ↔ sonra piksel + CDP font kullanımı karşılaştırması
name: Font kanıt (geçici)

on:
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/kurulum
      - name: Kanıt dosyaları (PR ucundan)
        run: |
          git fetch -q origin ${{ github.event.pull_request.head.sha }}
          mkdir -p app/zz-font-kanit "$RUNNER_TEMP/kanit"
          git show ${{ github.event.pull_request.head.sha }}:.github/font-kanit/once-page.tsx > app/zz-font-kanit/page.tsx
          git show ${{ github.event.pull_request.head.sha }}:.github/font-kanit/shots.mjs > .github/shots.mjs
          grep -c "next/font/google" app/layout.tsx
      - run: npx playwright install --with-deps chromium
      - name: Build (main, normal ağ)
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Ekran görüntüleri
        run: |
          (npx next start -p 3100 -H 127.0.0.1 > "$RUNNER_TEMP/start.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/register && break; sleep 2; done
          node .github/shots.mjs once 3100 "$RUNNER_TEMP/kanit/once"
      - uses: actions/upload-artifact@v4
        with:
          name: font-kanit-once
          path: ${{ runner.temp }}/kanit/once
          retention-days: 30

  once-agsiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./.github/actions/kurulum
      - name: Google Fonts ağını engelle (/etc/hosts) ve doğrula
        run: |
          printf '0.0.0.0 fonts.googleapis.com\n0.0.0.0 fonts.gstatic.com\n:: fonts.googleapis.com\n:: fonts.gstatic.com\n' | sudo tee -a /etc/hosts
          getent hosts fonts.gstatic.com fonts.googleapis.com
          if curl -sS -m 10 -o /dev/null https://fonts.gstatic.com/; then echo "ENGEL ETKİSİZ"; exit 1; else echo "fonts.gstatic.com erişilemez ✓"; fi
          curl -sS -m 10 -o /dev/null -w "github.com erişilebilir: %{http_code}\n" https://github.com/
      - name: Build (main, Google Fonts engelli) — DÜŞMESİ BEKLENİR
        id: build
        continue-on-error: true
        run: npx next build 2>&1 | tee "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Beklenen sonuç (main ağsız build FAIL) ve neden
        run: |
          echo "build sonucu: ${{ steps.build.outcome }}"
          grep -m3 -E "font/google|fonts.gstatic|Failed to fetch|Can't resolve" "$RUNNER_TEMP/build.log" || true
          test "${{ steps.build.outcome }}" = "failure"

  sonra-agsiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kurulum
      - name: Kanıt sayfası (yalnız bu runner'da; PR'a girmez)
        run: |
          mkdir -p app/zz-font-kanit "$RUNNER_TEMP/kanit"
          cp .github/font-kanit/sonra-page.tsx app/zz-font-kanit/page.tsx
          echo "next/font/google kullanımı (app/components/lib):"; ! grep -rn "from \"next/font/google\"" app components lib
      - run: npx playwright install --with-deps chromium
      - name: Google Fonts ağını engelle (/etc/hosts) ve doğrula
        run: |
          printf '0.0.0.0 fonts.googleapis.com\n0.0.0.0 fonts.gstatic.com\n:: fonts.googleapis.com\n:: fonts.gstatic.com\n' | sudo tee -a /etc/hosts
          getent hosts fonts.gstatic.com fonts.googleapis.com
          if curl -sS -m 10 -o /dev/null https://fonts.gstatic.com/; then echo "ENGEL ETKİSİZ"; exit 1; else echo "fonts.gstatic.com erişilemez ✓"; fi
      - name: Build (PR, Google Fonts engelli) — GEÇMELİ
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build çıktısında Google izi yok + font dosyaları birebir
        run: |
          echo "Google Fonts adresi geçen çıktı dosyası:"; ! grep -rl -E "fonts\.(googleapis|gstatic)\.com" .next/static .next/server 2>/dev/null
          echo "--- app/_fonts ↔ .next/static/media (SHA-256)"
          for f in app/_fonts/*.woff2 app/_fonts/*.ttf; do h=$(sha256sum "$f" | cut -d' ' -f1); m=$(find .next/static/media -type f -exec sha256sum {} + | grep "$h" | head -1 | awk '{print $2}'); echo "$(basename "$f") $h -> ${m:-YOK}"; test -n "$m"; done
      - name: Ekran görüntüleri (Google Fonts engelli)
        run: |
          (npx next start -p 3100 -H 127.0.0.1 > "$RUNNER_TEMP/start.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/register && break; sleep 2; done
          node .github/font-kanit/shots.mjs sonra 3100 "$RUNNER_TEMP/kanit/sonra"
      - uses: actions/upload-artifact@v4
        with:
          name: font-kanit-sonra
          path: ${{ runner.temp }}/kanit/sonra
          retention-days: 30

  kiyas:
    needs: [once, sonra-agsiz]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kurulum
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/k
      - name: Önce ↔ sonra
        run: node .github/font-kanit/kiyas.mjs "$RUNNER_TEMP/k/font-kanit-once" "$RUNNER_TEMP/k/font-kanit-sonra" "$RUNNER_TEMP/k/fark"
      - uses: actions/upload-artifact@v4
        with:
          name: font-kanit-fark
          path: ${{ runner.temp }}/k/fark
          retention-days: 30
