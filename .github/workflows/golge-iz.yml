# TANI DALI (I18N-F1-R5 altyapı ajanı) — yalnız bu tani/r5-* dalında golge-iz.yml geçici olarak archive-ui.e2e koşusuna çevrildi.
# Bu dal ASLA merge edilmez. Sır yok; production'a sıfır temas: build sahte 127.0.0.1 değerleriyle, test API'leri Playwright ile taklit eder.
name: Gölge iz doğrulaması

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kurulum
      - name: Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Test build'i için tip denetimini atla (yalnız bu runner)
        run: node scripts/campaign/ci-e2e-build-config.cjs
      - name: Build (webpack; sahte değerler)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54599
          NEXT_PUBLIC_SUPABASE_ANON_KEY: zz
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: zz
          SUPABASE_SERVICE_ROLE_KEY: zz
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx next build --webpack || npx next build --webpack
      - name: Sunucu + archive-ui.e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54599
          NEXT_PUBLIC_SUPABASE_ANON_KEY: zz
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: zz
          SUPABASE_SERVICE_ROLE_KEY: zz
          ARCHIVE_UI_URL: http://127.0.0.1:3991
        run: |
          mkdir -p "$RUNNER_TEMP/archive-ui"
          npx next start -p 3991 -H 127.0.0.1 > "$RUNNER_TEMP/archive-ui/sunucu.log" 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:3991/ && break; sleep 2; done
          npx tsx scripts/settings-export/archive-ui.e2e.ts "$RUNNER_TEMP/archive-ui" 2>&1 | tee "$RUNNER_TEMP/archive-ui/gunluk.txt"
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-ui-kanit
          path: ${{ runner.temp }}/archive-ui
          retention-days: 7
